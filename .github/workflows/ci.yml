name: CI

on:
  push:
    branches: [linux-port]
    tags: ['v*']
  pull_request:
    branches: [linux-port]
  workflow_dispatch:
    inputs:
      attest_release:
        description: "Generate and verify release artifact attestations"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-and-test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        build: [core, asan]
    runs-on: ubuntu-24.04
    env:
      BUILD_DIR: build-${{ matrix.build }}
      AHK_PACK_RUNTIME: ${{ github.workspace }}/build-pack-runtime/source/linux/core/ahk_core
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # preserve release/tag metadata for packaging and changelogs

      - name: Install dependencies
        run: |
          # GitHub-hosted runners intermittently hang contacting archive.ubuntu.com
          # (the "noble-security InRelease" stall seen in core/asan jobs).  Force
          # IPv4, bound apt timeouts, and retry the whole step so a transient
          # apt-mirror flake cannot stall the pipeline.
          # (no ForceIPv4: could break runners whose IPv6 route works)
          echo 'Acquire::Retries "5";' | sudo tee -a /etc/apt/apt.conf.d/99ci-retry
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99ci-retry
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99ci-retry
          retry() { for i in 1 2 3 4 5 6; do timeout 300 "$@" && return 0; echo "apt retry $i"; sudo dpkg --configure -a || true; sleep $((i*10)); done; return 1; }
          # The default archive.ubuntu.com mirror is intermittently unreachable
          # from GitHub runners; if the update fails after retries, fall back to
          # the Azure mirror that backs these runners, then retry once more.
          if ! retry sudo apt-get update; then
            echo "default mirror unreachable; switching to azure.archive.ubuntu.com"
            sudo sed -i -E 's@//(archive\|security)\.ubuntu\.com@//azure.archive.ubuntu.com@g'               /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null ||             sudo sed -i -E 's@//(archive\|security)\.ubuntu\.com@//azure.archive.ubuntu.com@g'               /etc/apt/sources.list 2>/dev/null || true
            retry sudo apt-get update
          fi
          retry sudo apt-get install -y --no-install-recommends \
            cmake g++ ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxtst-dev libxi-dev \
            libxfixes-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev \
            libffi-dev libdbus-1-dev dbus libgtk-3-dev zlib1g-dev libjpeg-dev \
            libei-dev libeis-dev liboeffis-dev libportal-dev \
            xvfb xdotool x11-xkb-utils x11-utils sway xwayland weston \
            xclip
          sudo apt-get install -y --no-install-recommends python3 dpkg-dev

      - name: Configure
        run: |
          cmake -S . -B "$BUILD_DIR"
          if [ "${{ matrix.build }}" = "asan" ]; then
            rm -rf "$BUILD_DIR"
            cmake -S . -B "$BUILD_DIR" -DCMAKE_BUILD_TYPE=Debug \
              -DCMAKE_CXX_FLAGS="-fsanitize=address -g" \
              -DCMAKE_C_FLAGS="-fsanitize=address -g" \
              -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
          fi
          cmake -S . -B build-pack-runtime -DAHK_ENABLE_LIBEI=OFF

      - name: Build
        run: |
          cmake --build "$BUILD_DIR" -j$(nproc)
          cmake --build build-pack-runtime -j$(nproc) --target ahk_core

      - name: Headless regression
        run: |
          bash tests/run_tests.sh "$BUILD_DIR/source/linux/core/ahk_core"

      # check_detail0824 M1-O: neither direction is self-verified by AHK.
      # An independent XI2 recorder observes Send as JSONL; a separate XTEST
      # client injects a key which AHK must capture.
      - name: External X11 input oracle
        if: matrix.build == 'core'
        run: xvfb-run -a bash tests/oracle/run_x11_oracle.sh "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Layout-aware key model oracle
        if: matrix.build == 'core'
        run: xvfb-run -a -s '-screen 0 1280x1024x24 -noreset' bash tests/oracle/run_keymodel_oracle.sh "$BUILD_DIR/source/linux/core/ahk_core"

      - name: XI2 raw multi-client capture oracle
        if: matrix.build == 'core'
        run: xvfb-run -a bash tests/oracle/run_raw_capture_oracle.sh "$BUILD_DIR/source/linux/core/ahk_core"

      - name: XI2 multi-process Hotstring oracle
        if: matrix.build == 'core'
        run: xvfb-run -a bash tests/oracle/run_multiscript_hotstring_oracle.sh "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Per-key InputHook suppression oracle
        if: matrix.build == 'core'
        run: xvfb-run -a bash tests/oracle/run_suppression_scope_oracle.sh "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Normalized input event model oracle
        if: matrix.build == 'core'
        run: xvfb-run -a bash tests/oracle/run_input_event_model_oracle.sh "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Normalized input pipeline equivalence oracle (check0901 M5a)
        if: matrix.build == 'core'
        run: bash tests/oracle/run_input_pipeline_oracle.sh "$BUILD_DIR/source/linux/inputd/ahk-inputd" "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Pipeline wildcard, LR and key-up oracle (check0901 M5b)
        if: matrix.build == 'core'
        run: bash tests/oracle/run_input_pipeline_special_oracle.sh "$BUILD_DIR/source/linux/inputd/ahk-inputd" "$BUILD_DIR/source/linux/core/ahk_core"

      - name: InputHook and Hotstring consumer pipeline oracle (check0901 M5b)
        if: matrix.build == 'core'
        run: bash tests/oracle/run_input_consumer_pipeline_oracle.sh "$BUILD_DIR/source/linux/inputd/ahk-inputd" "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Custom combo normalized pipeline oracle (check0901 M5b)
        if: matrix.build == 'core'
        run: bash tests/oracle/run_input_combo_pipeline_oracle.sh "$BUILD_DIR/source/linux/inputd/ahk-inputd" "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Broker remap transaction pipeline oracle (check0901 M5b)
        if: matrix.build == 'core'
        run: bash tests/oracle/run_input_remap_pipeline_oracle.sh "$BUILD_DIR/source/linux/inputd/ahk-inputd" "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Dynamic HotIf deadline and fail-open oracle (check0901 M5b)
        if: matrix.build == 'core'
        run: bash tests/oracle/run_input_dynamic_decision_oracle.sh "$BUILD_DIR/source/linux/inputd/ahk-inputd" "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Consented libei/EIS injection oracle (check0901 M6a)
        if: matrix.build == 'core'
        run: bash tests/oracle/run_input_libei_oracle.sh "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Inputd systemd socket activation oracle
        if: matrix.build == 'core'
        run: |
          command -v systemd-socket-activate
          bash tests/oracle/run_inputd_socket_activation_oracle.sh
          bash tests/oracle/run_inputd_client_framing_oracle.sh "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Inputd replay fail-open fault oracle (check0901 P0-1)
        if: matrix.build == 'core'
        run: bash tests/oracle/run_inputd_replay_failure_oracle.sh "$BUILD_DIR/source/linux/inputd/ahk-inputd"

      - name: Inputd protocol v2 oracle (check0901 P0-3)
        if: matrix.build == 'core'
        run: bash tests/oracle/run_inputd_v2_protocol_oracle.sh "$BUILD_DIR/source/linux/inputd/ahk-inputd"

      - name: Inputd broker-owned injection oracle (check0901 P0-3 M4)
        if: matrix.build == 'core'
        run: bash tests/oracle/run_inputd_injection_oracle.sh "$BUILD_DIR/source/linux/inputd/ahk-inputd" "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Inputd multi-client arbitration oracle (check0901 P1-4 M4)
        if: matrix.build == 'core'
        run: bash tests/oracle/run_inputd_arbitration_oracle.sh "$BUILD_DIR/source/linux/inputd/ahk-inputd"

      - name: Backend health, generation and reconciliation oracle (check0901 M2)
        if: matrix.build == 'core'
        run: bash tests/oracle/run_input_backend_health_oracle.sh "$BUILD_DIR/source/linux/inputd/ahk-inputd" "$BUILD_DIR/source/linux/core/ahk_core"

      - name: SendLevel/InputLevel policy oracle (check0901 P0-2/P1-3)
        if: matrix.build == 'core'
        run: bash tests/oracle/run_sendlevel_policy_oracle.sh "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Windows v2.0.26 differential trace gate
        if: matrix.build == 'core'
        run: bash tests/differential/run_linux_trace.sh "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Upload Windows differential evidence
        if: always() && matrix.build == 'core'
        uses: actions/upload-artifact@v5
        with:
          name: windows-v2.0.26-differential
          path: tests/differential/out/
          if-no-files-found: error

      - name: Fcitx5 IME commit protocol oracle
        if: matrix.build == 'core'
        run: bash tests/oracle/run_fcitx5_ime_protocol_oracle.sh "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Portal owner restart fault oracle
        if: matrix.build == 'core'
        run: bash tests/oracle/run_portal_restart_oracle.sh "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Compositor STOP-CONT fault oracle
        if: matrix.build == 'core'
        run: bash tests/oracle/run_compositor_stop_oracle.sh "$BUILD_DIR/source/linux/core/ahk_core"

      - name: EWMH window enumeration oracle
        if: matrix.build == 'core'
        run: xvfb-run -a bash tests/oracle/run_ewmh_oracle.sh "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Linux DBGp protocol oracle
        if: matrix.build == 'core'
        run: bash tests/oracle/run_dbgp_oracle.sh "$BUILD_DIR/source/linux/core/ahk_core"

      - name: AT-SPI pending-call source guard
        if: matrix.build == 'core'
        run: bash tests/oracle/check_atspi_pending_calls.sh

      - name: COM D-Bus bounded pending-call source guard (check0901 M7)
        if: matrix.build == 'core'
        run: bash tests/oracle/check_com_pending_calls.sh

      - name: COM D-Bus bounded recovery oracle (check0901 M7)
        if: matrix.build == 'core'
        run: bash tests/oracle/run_m7_dbus_oracle.sh "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Wayland compositor restart recovery oracle (check0901 M7)
        if: matrix.build == 'core'
        run: bash tests/oracle/run_m7_wayland_restart_oracle.sh "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Set up Node for VS Code extension
        if: matrix.build == 'core'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test and package VS Code extension
        if: matrix.build == 'core'
        working-directory: extensions/vscode-ahk-linux
        run: |
          npm test
          npm run package

      - name: Linux DBGp-to-DAP adapter oracle
        if: matrix.build == 'core'
        run: bash tests/oracle/run_dap_adapter_oracle.sh "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Upload VS Code extension VSIX
        if: matrix.build == 'core'
        uses: actions/upload-artifact@v5
        with:
          name: vscode-ahk-linux-vsix
          path: extensions/vscode-ahk-linux/*.vsix
          if-no-files-found: error

      - name: Upload external oracle trace
        if: always() && matrix.build == 'core'
        uses: actions/upload-artifact@v5
        with:
          name: input-oracle-x11
          path: tests/oracle/out/
          if-no-files-found: error

      - name: Doc-check (Xvfb)
        run: |
          bash tests/doccheck/run_check.sh --xvfb "$BUILD_DIR/source/linux/core/ahk_core"
        # check0818: the doc-check must gate merges (was continue-on-error).

      - name: Upload doc-check outputs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: doccheck-${{ matrix.build }}
          path: tests/doccheck/out/
          if-no-files-found: ignore

      - name: Wayland doc-check (pure + XWayland)
        run: |
          bash tests/doccheck/wayland_run.sh "$BUILD_DIR/source/linux/core/ahk_core"
          bash tests/doccheck/wayland_run.sh --xwayland "$BUILD_DIR/source/linux/core/ahk_core"
        env:
          XDG_RUNTIME_DIR: /tmp

      # check_detail0821 §14 / R4: the scenario acceptance runner gates the
      # seeded user scenarios under Xvfb (hotkeys, clipboard, long-press,
      # a&b, --pack, FileInstall resources, typed callbacks).
      - name: Scenario oracle identity lint
        run: python3 tests/scenarios/lint_oracles.py

      - name: Scenario runner (Xvfb)
        run: xvfb-run -a bash tests/scenarios/run_scenarios.sh "$BUILD_DIR/source/linux/core/ahk_core" --env x11

      - name: Complete examples catalog and curated profiles
        if: matrix.build == 'core'
        run: |
          python3 tools/gen_examples_catalog.py --check
          bash examples/run.sh all-curated "$BUILD_DIR/source/linux/core/ahk_core"

      # M6-T4: the same parameterized hotkey+Hotstring+clipboard+Timer workload
      # runs for 30s in CI; AHK_SOAK_SECONDS=86400 remains optional/manual.
      - name: Mixed soak (RSS slope + event counts)
        run: AHK_SOAK_SECONDS=30 xvfb-run -a bash tests/oracle/run_mixed_soak.sh "$BUILD_DIR/source/linux/core/ahk_core"

      - name: Upload mixed-soak evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: mixed-soak-${{ matrix.build }}
          path: tests/oracle/out/mixed-soak-summary.json
          if-no-files-found: ignore

      # check0819: the published numbers in CHECK_REPORT.md used to drift by
      # hand (Wayland "847", XWayland 235 vs 247).  This recomputes every
      # count from the expect files and fails the pipeline on any mismatch,
      # so the docs can never go stale again.
      - name: Verify report numbers match the suites
        run: bash tests/doccheck/verify_report_numbers.sh

      # check_detail0821 §13: parity_data.h must stay in sync with parity.tsv
      # (regenerated by tools/gen_parity.py).
      - name: Verify parity classification is in sync
        run: python3 tools/gen_parity.py --check

      # §13: every function doc page with a parity entry must carry the badge.
      - name: Verify parity doc badges are in sync
        run: python3 tools/gen_parity_badges.py --check

      # check_detail0824 M0-A: script/diag/docs share one versioned caps table.
      - name: Verify input capability documentation is in sync
        run: python3 tools/gen_input_caps.py --check

  # check_detail0821 §16-1 / R4: container matrix over four distros -- builds
  # the port + runs the headless regression + a display smoke inside each
  # container, so glibc/GTK version differences cannot regress portability.
  container-matrix:
    strategy:
      fail-fast: false
      matrix:
        image: [fedora:41, archlinux:latest, debian:12, ubuntu:22.04]
    runs-on: ubuntu-24.04
    container:
      image: ${{ matrix.image }}
      options: --user root
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: bash tools/linux/ci-container-deps.sh

      - name: Configure
        run: cmake -S . -B build-container

      - name: Build
        # -j2: the container memory quota is small; -j$(nproc) over-commits
        # and the C++ compile stalls/hangs (observed in the container matrix).
        run: cmake --build build-container -j2

      - name: Headless regression
        run: bash tests/run_tests.sh build-container/source/linux/core/ahk_core

      - name: Optional libei compile/wire matrix
        run: |
          if pkg-config --exists libei-1.0 libeis-1.0 liboeffis-1.0; then
            bash tests/oracle/run_input_libei_oracle.sh build-container/source/linux/core/ahk_core
          else
            build-container/source/linux/core/ahk_core --diag > /tmp/container-diag.txt
            grep -q 'libei-build  : no' /tmp/container-diag.txt
          fi

      # A display smoke under Xvfb: the built binary must start + run a script
      # that touches the X11/GTK init path.  Deliberately NOT MsgBox (it would
      # block forever on the unclicked dialog under headless); the script
      # writes a marker and exits.  Skipped when the distro lacks xvfb.
      - name: Xvfb smoke
        run: |
          if ! command -v xvfb-run >/dev/null; then
            echo "xvfb not installed; smoke skipped"
            exit 0
          fi
          rm -f /tmp/smoke_out.txt
          printf 'FileAppend("smoke-ok`n", "/tmp/smoke_out.txt")\nExitApp\n' > /tmp/smoke.ahk
          xvfb-run -a bash -c 'build-container/source/linux/core/ahk_core /tmp/smoke.ahk'
          test -f /tmp/smoke_out.txt && echo smoke-pass

  # check_detail0821 §5-M6 / R4: the packed binary must run in a container
  # WITHOUT the port installed -- it embeds both the interpreter and the
  # script (A_IsCompiled=1), and a FileInstall resource must land on disk.
  pack-container-acceptance:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install deps + build
        run: |
          bash tools/linux/ci-container-deps.sh
          cmake -S . -B build-pc
          cmake --build build-pc -j$(nproc)
          cmake -S . -B build-pack-runtime -DAHK_ENABLE_LIBEI=OFF
          cmake --build build-pack-runtime -j$(nproc) --target ahk_core
      - name: Pack + verify in a bare container
        run: |
          AHK="$PWD/build-pc/source/linux/core/ahk_core"
          export AHK_PACK_RUNTIME="$PWD/build-pack-runtime/source/linux/core/ahk_core"
          mkdir -p /tmp/packwork && cd /tmp/packwork
          printf 'PACKED-FILEINSTALL-OK' > res.txt
          cat > pkg.ahk <<'EOF'
          #Requires AutoHotkey v2.0
          FileInstall("/tmp/packwork/res.txt", "/tmp/packwork/out.txt")
          c := FileExist("/tmp/packwork/out.txt") ? FileRead("/tmp/packwork/out.txt") : ""
          FileAppend("compiled=" A_IsCompiled " res=" (c = "PACKED-FILEINSTALL-OK" ? 1 : 0) "`n", "/tmp/packwork/pk.txt")
          ExitApp
          EOF
          "$AHK" --pack /tmp/packwork/packed /tmp/packwork/pkg.ahk
          # A clean ubuntu:24.04 container (no AHK installed; its runtime
          # shared libs match the build host) must run the packed binary and
          # have it extract the FileInstall resource -- proving the packed
          # binary needs no AHK installation, only the standard system libs.
          # (debian:12 would work too but its libjpeg ABI differs from the
          # build host's libjpeg8; the wcslcpy/strlcpy self-containment that
          # debian's older glibc exposed is covered by the symbol check.)
          docker run --rm -v /tmp/packwork:/tmp/packwork -w /tmp/packwork ubuntu:24.04 \
            bash -c 'apt-get update -y -qq >/dev/null 2>&1 && apt-get install -y -qq --no-install-recommends libx11-6 libxext6 libxrandr2 libxinerama1 libxtst6 libxi6 libxfixes3 libxkbcommon0 libxkbcommon-x11-0 libwayland-client0 libffi8 libgtk-3-0 zlib1g libjpeg8 >/dev/null 2>&1; rm -f out.txt pk.txt; ./packed; grep -q "compiled=1 res=1" pk.txt && echo pack-acceptance-pass'

  # check_detail0821 §16-3 / R4: a no-XWayland job -- sway with xwayland
  # disabled runs the Wayland suite, proving the pure-Wayland downgrade path
  # does not crash and reports clearly.
  no-xwayland:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Install deps + build
        run: |
          bash tools/linux/ci-container-deps.sh
          cmake -S . -B build-nox
          cmake --build build-nox -j$(nproc)
      # The default wayland_run.sh mode already disables xwayland in the sway
      # config (line 49: `xwayland disable`), which is exactly the §16-3
      # pure-Wayland downgrade path; --xwayland is the opt-in enabled mode.
      - name: Wayland suite with xwayland disabled
        run: |
          bash tests/doccheck/wayland_run.sh build-nox/source/linux/core/ahk_core
          # Portal v2 unavailable/transport absent is an allowed auto fallback:
          # prove non-ASCII paste/virtual-keyboard still works after a failed
          # libei probe and never waits on the caller's real session bus.
          AHK_WAYLAND_LIBEI=1 \
            DBUS_SESSION_BUS_ADDRESS=unix:path=/tmp/ahk-no-such-session-bus \
            bash tests/doccheck/wayland_run.sh build-nox/source/linux/core/ahk_core
        env:
          XDG_RUNTIME_DIR: /tmp

  tsan-input:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install dependencies
        run: |
          echo 'Acquire::Retries "5";' | sudo tee -a /etc/apt/apt.conf.d/99ci-retry
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99ci-retry
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99ci-retry
          retry() { for i in 1 2 3 4 5 6; do timeout 300 "$@" && return 0; sudo dpkg --configure -a || true; sleep $((i*10)); done; return 1; }
          retry sudo apt-get update
          retry sudo apt-get install -y --no-install-recommends \
            cmake g++ pkg-config python3 \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxtst-dev \
            libxi-dev libxfixes-dev libwayland-dev wayland-protocols \
            libxkbcommon-dev libxkbcommon-x11-dev libffi-dev libdbus-1-dev \
            dbus libgtk-3-dev zlib1g-dev libjpeg-dev xvfb x11-xkb-utils

      - name: Configure ThreadSanitizer
        run: |
          # Explicit OFF build is the optional-dependency oracle: the same
          # source must compile/run without libei/liboeffis installed.
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DAHK_ENABLE_LIBEI=OFF \
            -DCMAKE_CXX_FLAGS="-fsanitize=thread -g -O0 -fno-omit-frame-pointer" \
            -DCMAKE_C_FLAGS="-fsanitize=thread -g -O0 -fno-omit-frame-pointer" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=thread"

      - name: Build ThreadSanitizer
        run: |
          cmake --build build-tsan -j$(nproc)
          build-tsan/source/linux/core/ahk_core --diag > /tmp/tsan-diag.txt
          grep -q 'libei-build  : no (libei=not-built liboeffis=not-built libportal=not-built)' /tmp/tsan-diag.txt
          if ldd build-tsan/source/linux/core/ahk_core | grep -q 'libei\|liboeffis'; then
            echo 'feature-off TSan build unexpectedly links libei' >&2
            exit 1
          fi

      - name: TSan headless and input oracles
        env:
          TSAN_OPTIONS: halt_on_error=1:exitcode=66:second_deadlock_stack=1
        run: |
          bash tests/run_tests.sh build-tsan/source/linux/core/ahk_core
          xvfb-run -a bash tests/oracle/run_x11_oracle.sh build-tsan/source/linux/core/ahk_core
          xvfb-run -a -s '-screen 0 1280x1024x24 -noreset' \
            bash tests/oracle/run_keymodel_oracle.sh build-tsan/source/linux/core/ahk_core
          xvfb-run -a bash tests/oracle/run_raw_capture_oracle.sh build-tsan/source/linux/core/ahk_core
          xvfb-run -a bash tests/oracle/run_suppression_scope_oracle.sh build-tsan/source/linux/core/ahk_core

  package:
    runs-on: ubuntu-24.04
    needs: [build-and-test, tsan-input]
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      # Empty secrets produce an explicit UNSIGNED marker; they never trigger
      # key generation. When configured, both values are mandatory.
      AHK_RELEASE_SIGNING_KEY: ${{ secrets.AHK_RELEASE_SIGNING_KEY }}
      AHK_RELEASE_SIGNING_FINGERPRINT: ${{ secrets.AHK_RELEASE_SIGNING_FINGERPRINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # preserve release/tag metadata for packaging and changelogs

      - name: Set up Node for VSIX packaging
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          # GitHub-hosted runners intermittently hang contacting archive.ubuntu.com
          # (the "noble-security InRelease" stall seen in core/asan jobs).  Force
          # IPv4, bound apt timeouts, and retry the whole step so a transient
          # apt-mirror flake cannot stall the pipeline.
          # (no ForceIPv4: could break runners whose IPv6 route works)
          echo 'Acquire::Retries "5";' | sudo tee -a /etc/apt/apt.conf.d/99ci-retry
          echo 'Acquire::http::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99ci-retry
          echo 'Acquire::https::Timeout "15";' | sudo tee -a /etc/apt/apt.conf.d/99ci-retry
          retry() { for i in 1 2 3 4 5 6; do timeout 300 "$@" && return 0; echo "apt retry $i"; sudo dpkg --configure -a || true; sleep $((i*10)); done; return 1; }
          # The default archive.ubuntu.com mirror is intermittently unreachable
          # from GitHub runners; if the update fails after retries, fall back to
          # the Azure mirror that backs these runners, then retry once more.
          if ! retry sudo apt-get update; then
            echo "default mirror unreachable; switching to azure.archive.ubuntu.com"
            sudo sed -i -E 's@//(archive\|security)\.ubuntu\.com@//azure.archive.ubuntu.com@g'               /etc/apt/sources.list.d/ubuntu.sources 2>/dev/null ||             sudo sed -i -E 's@//(archive\|security)\.ubuntu\.com@//azure.archive.ubuntu.com@g'               /etc/apt/sources.list 2>/dev/null || true
            retry sudo apt-get update
          fi
          retry sudo apt-get install -y --no-install-recommends \
            cmake g++ ninja-build pkg-config \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxtst-dev libxi-dev \
            libxfixes-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev libxkbcommon-x11-dev \
            libffi-dev libdbus-1-dev dbus libgtk-3-dev libjpeg-dev \
            libei-dev liboeffis-dev libportal-dev \
            python3 dpkg-dev rpm libfuse2 squashfs-tools
          # appimagetool (continuous, v295+) packages the AppDir through
          # FUSE; GitHub-hosted runners have no /dev/fuse by default, so
          # the device node must be recreated (the kernel fuse module and
          # libfuse2 are present, only the node is missing).
          if [ ! -e /dev/fuse ]; then
            sudo mknod /dev/fuse c 10 229
          fi
          sudo chmod 666 /dev/fuse 2>/dev/null || true

      - name: Build
        run: |
          cmake -S . -B build-core
          cmake --build build-core -j$(nproc)
          cmake -S . -B build-pack-runtime -DAHK_ENABLE_LIBEI=OFF
          cmake --build build-pack-runtime -j$(nproc) --target ahk_core

      - name: Build packages
        run: |
          bash tools/linux/pack.sh
          # AppImage + RPM are part of the release (check0820: the old
          # download/URL and source-layout bugs made them fail silently
          # under `|| true`; now they must build).
          bash tools/linux/pack-appimage.sh
          bash tools/linux/pack-rpm.sh
          ( cd extensions/vscode-ahk-linux && npm test && npm run package )
          cp extensions/vscode-ahk-linux/*.vsix dist/
          # Regenerate CKSUMS.txt so it covers ALL dist artifacts (incl.
          # AppImage/RPM/VSIX) and re-sign it (pack.sh runs before those exist).
          bash tools/linux/pack-finalize.sh
          ls -la dist/

      - name: Verify packages
        run: |
          # head closes the pipe early -> tar gets SIGPIPE (exit 141);
          # ignore it (the listing is just a sanity check).
          set +e
          tar tzf dist/autohotkey-linux-*.tar.gz | head -5
          tar_rc=$?
          set -e
          [ $tar_rc -eq 0 ] || [ $tar_rc -eq 141 ]
          dpkg-deb --info dist/autohotkey-linux-*.deb > /tmp/ahk-deb-info.txt
          head -8 /tmp/ahk-deb-info.txt
          dpkg-deb -f dist/autohotkey-linux-*.deb Depends > /tmp/ahk-deb-depends.txt
          rpm -qp --requires dist/*.rpm > /tmp/ahk-rpm-requires.txt
          rpm -qp --provides dist/*.rpm > /tmp/ahk-rpm-provides.txt
          tar tzf dist/autohotkey-linux-*.tar.gz > /tmp/ahk-tar-contents.txt
          dpkg-deb --contents dist/autohotkey-linux-*.deb > /tmp/ahk-deb-contents.txt
          rpm -qlp dist/*.rpm > /tmp/ahk-rpm-contents.txt
          grep -q 'libei1 (>= .*), liboeffis1 (>= ' /tmp/ahk-deb-depends.txt
          grep -q 'libei.so.1' /tmp/ahk-rpm-requires.txt
          grep -q 'liboeffis.so.1' /tmp/ahk-rpm-requires.txt
          grep -q 'libei.so.1' /tmp/ahk-rpm-provides.txt
          grep -q 'liboeffis.so.1' /tmp/ahk-rpm-provides.txt
          # linux.19: every package must carry AutoHotkey's official tray
          # assets, the standalone pack runtime and matched optional libraries.
          grep -q 'autohotkey-linux/icon_main.ico' /tmp/ahk-tar-contents.txt
          grep -q 'autohotkey-linux/autohotkey.png' /tmp/ahk-tar-contents.txt
          grep -q 'autohotkey-linux/ahk_core_pack' /tmp/ahk-tar-contents.txt
          grep -q 'autohotkey-linux/lib/libei.so.1' /tmp/ahk-tar-contents.txt
          grep -q 'autohotkey-linux/lib/liboeffis.so.1' /tmp/ahk-tar-contents.txt
          grep -q 'usr/share/autohotkey/ahk_core_pack' /tmp/ahk-deb-contents.txt
          grep -q 'usr/share/autohotkey/icon_main.ico' /tmp/ahk-deb-contents.txt
          grep -q 'usr/share/icons/hicolor/16x16/apps/autohotkey.png' /tmp/ahk-deb-contents.txt
          grep -q '/usr/share/autohotkey/ahk_core_pack' /tmp/ahk-rpm-contents.txt
          grep -q '/usr/share/autohotkey/lib/libei.so.1' /tmp/ahk-rpm-contents.txt
          grep -q '/usr/share/autohotkey/lib/liboeffis.so.1' /tmp/ahk-rpm-contents.txt
          grep -q '/usr/share/autohotkey/icon_main.ico' /tmp/ahk-rpm-contents.txt
          grep -q '/usr/share/icons/hicolor/16x16/apps/autohotkey.png' /tmp/ahk-rpm-contents.txt
          # EX-1: full generated examples must ship in tar/deb/rpm payloads.
          grep -q 'autohotkey-linux/examples/FUNCTION_COVERAGE.md' /tmp/ahk-tar-contents.txt
          grep -q 'autohotkey-linux/examples/generated/ControlClick.md' /tmp/ahk-tar-contents.txt
          grep -q 'usr/share/doc/autohotkey/examples/FUNCTION_COVERAGE.md' /tmp/ahk-deb-contents.txt
          grep -q '/usr/share/doc/autohotkey/examples/FUNCTION_COVERAGE.md' /tmp/ahk-rpm-contents.txt
          # M4 packaging: daemon + exact systemd socket/service lifecycle.
          grep -q 'autohotkey-linux/ahk-inputd' /tmp/ahk-tar-contents.txt
          grep -q 'autohotkey-linux/tools/linux/systemd/ahk-inputd.socket' /tmp/ahk-tar-contents.txt
          grep -q 'usr/share/autohotkey/ahk-inputd' /tmp/ahk-deb-contents.txt
          grep -q 'usr/lib/systemd/system/ahk-inputd.socket' /tmp/ahk-deb-contents.txt
          grep -q '/usr/share/autohotkey/ahk-inputd' /tmp/ahk-rpm-contents.txt
          grep -q '/usr/lib/systemd/system/ahk-inputd.socket' /tmp/ahk-rpm-contents.txt
          dist/*.AppImage --appimage-extract >/tmp/appimage_extract.log 2>&1
          test -f squashfs-root/usr/share/autohotkey/icon_main.ico
          test -f squashfs-root/usr/share/autohotkey/autohotkey.png
          test -x squashfs-root/usr/bin/ahk-inputd
          test -x squashfs-root/usr/bin/ahk_core_pack
          if ldd squashfs-root/usr/bin/ahk_core_pack | grep -q 'libei\|liboeffis'; then
            echo 'AppImage pack runtime unexpectedly links libei' >&2
            exit 1
          fi
          test -f squashfs-root/usr/lib/libei.so.1
          test -f squashfs-root/usr/lib/liboeffis.so.1
          rm -rf squashfs-root
          ls dist/*.AppImage dist/*.rpm dist/*.vsix
          vsix_version=$(node -p "require('./extensions/vscode-ahk-linux/package.json').version")
          grep -q "autohotkey-linux-tools-${vsix_version}.vsix" dist/CKSUMS.txt

      # check0820: every release ships a CKSUMS.txt (SHA-256) so
      # `ahk --update <VER>` can be verified against the published hashes
      # (and older releases stay available for rollback).  This step checks
      # that the hashes match the artifacts actually built here.
      - name: Verify release checksums
        run: |
          grep -E '^  [0-9a-f]{64}  ' dist/CKSUMS.txt | sed -n 's/^  //p' > /tmp/ck.txt
          ( cd dist && sha256sum -c /tmp/ck.txt )

      # M0-C: no self-generated OpenPGP identities. A build is either signed
      # by a configured, fingerprint-pinned long-term key or explicitly marked
      # UNSIGNED; release provenance is provided by the attestation steps below.
      - name: Verify explicit OpenPGP trust status
        run: |
          if test -s dist/CKSUMS.txt.asc; then
            test -s dist/SIGNING_KEY_FINGERPRINT.txt
            grep -q 'OpenPGP status: SIGNED with pinned' dist/CKSUMS.txt
          else
            test -s dist/UNSIGNED.txt
            grep -q 'OpenPGP status: UNSIGNED' dist/CKSUMS.txt
            test ! -e dist/ahk-release.pub
          fi

      # check0819 P2-1: actually INSTALL each package, run the interpreter
      # and the launcher commands, then remove it again -- the previous
      # 'Verify packages' step only listed archive contents and read .deb
      # metadata.  The tarball update step downloads the release asset from
      # GitHub, so this also proves the published asset round-trips.
      - name: Install/run/uninstall the packages
        run: |
          VER=$(ls dist/autohotkey-linux-*-amd64.deb | sed -n 's/.*linux-\([0-9.]*-linux\.[0-9]*\)-amd64.deb/\1/p' | head -1)
          bash tools/linux/verify-packages.sh "$VER"

      # Current GitHub guidance uses actions/attest@v4. Public repositories
      # receive a Sigstore Public Good signature + transparency-log entry
      # (SLSA Build L2 provenance). Normal branch CI deliberately skips this.
      - name: Attest release package provenance
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.attest_release == true }}
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/autohotkey-linux-*.tar.gz
            dist/autohotkey-linux-*.deb
            dist/autohotkey-linux-*.rpm
            dist/autohotkey-linux-*.AppImage
            dist/*.vsix
            dist/CKSUMS.txt

      - name: Verify release package attestations
        if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.attest_release == true }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in dist/autohotkey-linux-*.tar.gz dist/autohotkey-linux-*.deb \
                          dist/autohotkey-linux-*.rpm dist/autohotkey-linux-*.AppImage \
                          dist/*.vsix dist/CKSUMS.txt; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY"
          done

      - name: Upload release assets
        uses: actions/upload-artifact@v5
        with:
          name: release-assets
          path: |
            dist/autohotkey-linux-*.tar.gz
            dist/autohotkey-linux-*.deb
            dist/autohotkey-linux-*.rpm
            dist/autohotkey-linux-*.AppImage
            dist/*.vsix
            dist/CKSUMS.txt
            dist/CKSUMS.txt.asc
            dist/SIGNING_KEY_FINGERPRINT.txt
            dist/UNSIGNED.txt
          if-no-files-found: error
