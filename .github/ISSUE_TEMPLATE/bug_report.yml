name: Bug report (Linux port)
description: Report a problem with the AutoHotkey Linux port
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report. Please include the
        output of `ahk --diag` (one command, paste the whole block) and a minimal
        reproduction script â€?most bugs can be reproduced with a few lines.
  - type: textarea
    id: diag
    attributes:
      label: Environment diagnostic (`ahk --diag`)
      description: Run `ahk --diag` and paste the complete output. This is the single
        most useful piece of information â€?it reports version, session type, the
        active input backend and its capabilities, GNOME/portal reachability,
        clipboard watch state and uinput access.
      placeholder: "=== AutoHotkey Linux diagnostic === ..."
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Port version
      description: Output of `ahk --version` (e.g. v2.0.26-linux.19) or the commit you built from
      placeholder: v2.0.26-linux.19
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - Debian/Ubuntu .deb
        - Tarball + install.sh
        - Built from source
    validations:
      required: true
  - type: dropdown
    id: session
    attributes:
      label: Session / display
      options:
        - X11 (Xorg)
        - XWayland (Wayland session running X11 apps)
        - Native Wayland (GNOME 49)
        - Native Wayland (sway/wlroots)
        - Native Wayland (KDE Plasma)
        - Headless / no display
      description: Which display environment does the problem occur in?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction script
      description: The smallest .ahk script that triggers the problem (paste the script)
      render: ahk
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened? Paste error messages / terminal output.
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Distro + version, desktop/WM, keyboard layout, input method if any
      placeholder: Ubuntu 24.04, GNOME 49 Wayland, us layout, ibus
